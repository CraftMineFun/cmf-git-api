- date: 1787450817361
  level: maintain
  title: 服务器已更换
  content: |
    我们已将服务器迁移到性能更好的设备。预计游玩延迟会增加30ms，但是服务器卡顿大幅减缓。
    服务器仍然使用赞助商【集云社】产品进行支持。通过本站主页底部的友情链接与我们的赞助商取得联系，按需租用物美价廉的云服务！

- date: 1789299933333
  level: maintain
  title: 0.1.10 更新
  content: |
    此次更新【已于2026年9月14日9:30部署】更新内容如下：
    [!] 我们在客户端内准备了一个Mod用于修复在客户端的手模丢失问题（体现在玩家手持带有GUI瞄准镜的枪械时，若枪械来自CP2077枪包或瞄准镜来自此包，瞄准时立刻丢失手部和手中物品的模型）
    感谢来自RayFilm的帮助。

    [新增Mod]
    - AeroWarfare Compat 1.15.0
    - Ultimate Car Mod 1.0.46
    - Compact Gearbox 1.0.2
    - Create Tweaked Controllers 1.2.7
    - Create: Diesel Generators 1.3.15
    - Create: Numismatics 1.1.0
    - Design'n'Decor 2.2b
    - DriveByWire 0.3.0
    - Escalated 1.3.2
    - HaloVecs 5.1.0
    - MCSP 1.0.10
    - Rolling Tones 0.2.2
    - SN Assets 1.0.2
    - TaCZ (NeoForge Port) 1.1.8-hf-r6
    - theSubmarineMod 1.0.0
    - Traffic Craft 1.2.0+3
    - YWZJ 0.5.10
    - DragonLib b3.0.28

    [新增Mod: 客户端优化与修复]
    - Searchables 1.0.2
    - Controlling 19.0.5
    - RayBlankFix by RayFilm 1.0

    [移除Mod]
    由于过于劣质的物理逻辑，现在决定彻底移除Immersive Vehicle和其附属Mod。
    - Immersive Vehicle
    - OAmP
    - R.A.G.E.
    - MTS Official Pack
    - BL Accessories Layer 这个插槽会导致无法尽可能多地携带腰带物品

    [其他内容]
    - 我们正在征集一些节日！在游戏中的每一年度过节日，或许可以有对应的礼品发放。目前设定了除新年以外有一年便乘二度的114节，分别在1月14日和11月4日。
    - 一部分合成表冲突的问题已被解决。
    - 现在可以通过木剑选区然后使用命令[/lock-door]来防止手动误触装饰性的门。但是请注意，红石影响无法被屏蔽。
    - 添加了一些合成表来用炼金的方式减缓蕨芽短缺的问题

    [备注]
    我们建议通过快捷键关闭Sit on Everything的[ctrl+右键]坐下功能，然后前往设置移除此快捷键（在对应项分配按键时按下esc）以减轻服务端的日志输出负担。

- date: 1788145796565
  level: accident
  title: 模组性能问题（SuperbWarfare）
  content: |
    模组 “卓越前线” 现已确认存在周期性导致服务器卡顿的问题 (#MQX26003)
    在解决方案确认之前，请尽可能少布置常驻的激光炮塔和载具。载具除非作为必要装饰，否则请收在集装箱里。
    刻意使用载具挂区块常加载被发现将没收载具并对对应区块范围实施严格的实体清理与优化。

- date: 1788593159112
  level: maintain
  title: 接到可能断电的警告
  content: |
    接到通知，未来的3小时内上级电源可能进入维护状态。(2026年9月5日 15点30分开始算)
    若突发断电，游戏中的进度可能会部分回退，机器状态可能受损。但是我们会在来电后的十分钟内完成服务器重启。
    此次事件不计入事故。

